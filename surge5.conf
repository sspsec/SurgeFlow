DOMAIN-SUFFIX,meta.ai,"AI 服务"
DOMAIN-SUFFIX,sora.com,"AI 服务"
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream.conf,"Netflix",extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/telegram.conf,"Telegram",extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cdn.conf,"Apple",extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft_cdn.conf,"Microsoft",extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/cdn.conf,"节点选择",extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/global.conf,"节点选择",extended-matching

# 国内通用 -> 指向办公通道
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,"国内直连",extended-matching

# ============================================
# 5. IP 类规则
# ============================================
RULE-SET,LAN,"国内直连"
RULE-SET,https://ruleset.skk.moe/List/ip/telegram.conf,"Telegram"
GEOIP,CN,"国内直连"

FINAL,漏网之鱼,dns-failed

[Host]
# > 校园网业务域名：始终用系统 DNS 解析（连校园网时即校园内网 DNS）
*.campus.example.com = server:system
campus.example.com = server:system

[MITM]
h2 = true
# > 当前无 HTTPS 解密需求，ca 证书已移除；如需恢复在 Surge 中重新生成证书并取消 hostname 注释
# hostname = mi.com, *.mi.com, xiaomi.net, *.xiaomi.net, xiaomi.com, *.xiaomi.com


# ============================================
# 面板 (Panel) 设置
# ============================================

[Script]
network_health = type=generic,script-path=network_health.js,timeout=8

[Panel]
NetworkHealth = title=网络健康,content=正在检测...,style=info,script-name=network_health,update-interval=60
